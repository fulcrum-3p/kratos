name: Publish container images

on:
  push:
    branches:
      - fulcrum_main

permissions:
  contents: read

concurrency:
  group: kratos-publish-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish source image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          role-session-name: kratos-build-${{ github.run_id }}
          unset-current-credentials: true
          aws-region: us-east-2

      - name: Log in to source ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registries: "280296955917"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push source image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .docker/Dockerfile-build
          platforms: linux/amd64
          tags: 280296955917.dkr.ecr.us-east-2.amazonaws.com/kratos:${{ github.sha }}
          push: true

  copy:
    name: Copy image to ${{ matrix.destination.region }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        destination:
          - account: "280296955917"
            region: us-west-2
          - account: "833023401363"
            region: eu-west-1
          - account: "833023401363"
            region: us-west-2
          - account: "833023401363"
            region: us-east-1
          - account: "833023401363"
            region: ap-southeast-2
          - account: "833023401363"
            region: eu-central-1
          - account: "833023401363"
            region: ap-southeast-4
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.docker
      SOURCE_IMAGE: 280296955917.dkr.ecr.us-east-2.amazonaws.com/kratos:${{ github.sha }}
      DESTINATION_REGISTRY: ${{ matrix.destination.account }}.dkr.ecr.${{ matrix.destination.region }}.amazonaws.com
    steps:
      - name: Prepare registry credentials directory
        run: mkdir -p "$DOCKER_CONFIG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          role-session-name: kratos-copy-${{ matrix.destination.region }}-${{ github.run_id }}
          unset-current-credentials: true
          aws-region: us-east-2

      - name: Log in to source ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        with:
          registries: "280296955917"

      - name: Log in to destination ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        env:
          AWS_REGION: ${{ matrix.destination.region }}
          AWS_DEFAULT_REGION: ${{ matrix.destination.region }}
        with:
          registries: ${{ matrix.destination.account }}

      - name: Copy image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint skopeo \
            --volume "$DOCKER_CONFIG:/auth:ro" \
            quay.io/skopeo/stable:v1 \
            copy \
            --src-authfile /auth/config.json \
            --dest-authfile /auth/config.json \
            --src-tls-verify=true \
            --dest-tls-verify=true \
            "docker://$SOURCE_IMAGE" \
            "docker://$DESTINATION_REGISTRY/kratos:$IMAGE_TAG"
